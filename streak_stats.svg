<svg xmlns="http://www.w3.org/2000/svg" width="495" height="195" viewBox="0 0 495 195" fill="none">
  <style>
    @import url('https://fonts.googleapis.com/css2?family=Orbitron:wght@700;800&amp;display=swap');
    .title { font-family: 'Orbitron', 'Segoe UI', system-ui, -apple-system, sans-serif; font-size: 11px; fill: #8b949e; font-weight: 700; letter-spacing: 1.5px; }
    .value { font-family: 'Orbitron', 'Segoe UI', system-ui, -apple-system, sans-serif; font-size: 26px; fill: #00f3ff; font-weight: 800; }
    .dates { font-family: 'Segoe UI', system-ui, -apple-system, sans-serif; font-size: 10px; fill: #58a6ff; font-weight: 500; }
    .ring-bg { stroke: #1f2937; stroke-width: 4.5; }
    .ring-fill { stroke: #ff007f; stroke-width: 4.5; stroke-linecap: round; filter: drop-shadow(0 0 2px #ff007f); }
    .glow { filter: drop-shadow(0 0 4px #00f3ff); }
  </style>
  
  <!-- Background Card with neon border -->
  <rect x="0.5" y="0.5" width="494" height="194" rx="10" fill="#030712" stroke="#1f2937" stroke-width="1" />
  
  <!-- Left Column: Total Contributions -->
  <g transform="translate(15, 35)">
    <!-- Icon (Graph/Stats) -->
    <path d="M12 2c5.52 0 10 4.48 10 10s-4.48 10-10 10S2 17.52 2 12 6.48 2 12 2zm1 10h3l-4-4-4 4h3v4h2v-4z" fill="#00f3ff" class="glow" transform="scale(1.2) translate(-3, -3)"/>
    <text x="35" y="16" class="title">TOTAL CONTR.</text>
    <text x="35" y="48" class="value">676</text>
    <text x="35" y="68" class="dates">Aug 6, 2025 - Aug 4, 2026</text>
  </g>
  
  <!-- Center Column: Current Streak -->
  <g transform="translate(247.5, 90)">
    <!-- Circular Ring -->
    <circle r="36" class="ring-bg" fill="none" />
    <circle r="36" class="ring-fill" fill="none" stroke-dasharray="226" stroke-dashoffset="30" transform="rotate(-90)" />
    
    <!-- Flame Icon on Top of Ring -->
    <path d="M12 2c-5.52 0-10 4.48-10 10 0 5.52 4.48 10 10 10s10-4.48 10-10c0-5.52-4.48-10-10-10zm1 12.93c-.92.41-1.93.07-2.48-.79-.55-.86-.4-1.99.34-2.68.73-.69 1.14-1.63 1.14-2.61 0-.49-.1-.97-.29-1.42-.19-.45-.47-.85-.82-1.18.96.48 1.69 1.34 2.01 2.37.32 1.03.22 2.15-.29 3.1-.51.95-.51 2.07 0 3.02.13.25.29.49.49.7-.1.08-.2.15-.3.22-.07.05-.15.1-.23.15-.09.06-.18.12-.27.18z" fill="#ff007f" transform="translate(-12, -56) scale(1.1)"/>
    
    <!-- Streak Value inside Ring -->
    <text x="0" y="8" text-anchor="middle" class="value" style="font-size: 22px; fill: #ffffff; font-weight: 800;">365</text>
    
    <!-- Label & Dates below Ring -->
    <text x="0" y="58" text-anchor="middle" class="title" style="fill: #ff007f; font-size: 11px; font-weight: 800;">CURRENT STREAK</text>
    <text x="0" y="78" text-anchor="middle" class="dates">Aug 6, 2025 - Aug 4, 2026</text>
  </g>
  
  <!-- Right Column: Longest Streak -->
  <g transform="translate(315, 35)">
    <!-- Icon (Trophy) -->
    <path d="M19 5h-2V3H7v2H5c-1.1 0-2 .9-2 2v3c0 2.44 1.72 4.48 4 4.92V17c0 1.66 1.34 3 3 3h4c1.66 0 3-1.34 3-3v-2.08c2.28-.44 4-2.48 4-4.92V7c0-1.1-.9-2-2-2zm-14 5V7h2v3c0 1.2-.74 2.22-1.78 2.59A1.996 1.996 0 0 1 5 10zm14 0c0 1.01-.58 1.88-1.42 2.29C16.74 12.22 16 11.2 16 10V7h2v3z" fill="#00f3ff" class="glow" transform="scale(1.1) translate(3, -2)"/>
    <text x="35" y="16" class="title">LONGEST STREAK</text>
    <text x="35" y="48" class="value" style="fill: #00f3ff;">365</text>
    <text x="35" y="68" class="dates">Aug 6, 2025 - Aug 4, 2026</text>
  </g>
</svg>
